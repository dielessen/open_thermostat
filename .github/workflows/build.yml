name: PlatformIO CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [e32v2, esp32dev, esp32s3, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'boards/**') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0
      - name: Run native tests
        if: matrix.environment == 'native'
        run: pio test -e native --verbose
      - name: Build firmware
        if: matrix.environment != 'native'
        run: pio run -e ${{ matrix.environment }}
      - name: Build E32 filesystem and verify safety/layout
        if: matrix.environment == 'e32v2'
        run: |
          pio run -e e32v2 -t buildfs
          python scripts/verify_e32v2.py
          python scripts/test_e32v2_verifier.py
      - name: Package E32 V2 bench-test images
        if: matrix.environment == 'e32v2'
        run: |
          mkdir -p out/e32v2
          cp .pio/build/e32v2/{bootloader,partitions,firmware,spiffs}.bin out/e32v2/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin out/e32v2/
          cp partitions_e32v2.csv docs/BBQKEES_E32V2{,_VALIDATION,_TEST_RELEASE}.md out/e32v2/
          cp docs/FLASHEN_NL.md out/e32v2/
          git rev-parse HEAD > out/e32v2/SOURCE_COMMIT.txt
          pio pkg list -e e32v2 > out/e32v2/BUILD_PACKAGES.txt
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            --output out/e32v2/e32v2-factory.bin --target-offset 0 \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x1000 out/e32v2/bootloader.bin 0x8000 out/e32v2/partitions.bin \
            0xe000 out/e32v2/boot_app0.bin 0x10000 out/e32v2/firmware.bin \
            0x710000 out/e32v2/spiffs.bin
          cd out/e32v2
          sha256sum -- * > SHA256SUMS.txt
      - name: Upload verified E32 V2 bench-test package
        if: matrix.environment == 'e32v2'
        uses: actions/upload-artifact@v4
        with:
          name: e32v2-bench-test
          path: out/e32v2/
          if-no-files-found: error
          retention-days: 30
