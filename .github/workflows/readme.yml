name: Refresh project page

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-page-release-links
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # A release event may reference an older tag without this helper.
          ref: ${{ github.event.repository.default_branch }}
      - name: Test release selection and preservation of the project page
        run: python3 -m unittest discover -s scripts -p test_sync_readme_releases.py -v
      - name: Refresh published releases on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_readme_releases.py --repository "$GITHUB_REPOSITORY" --apply
