<section id="ems-devices" class="ems-devices">
  <h1 data-i18n="EMS devices">EMS devices</h1>
  <p data-i18n="Devices and entities observed on the EMS bus. Refresh reads the local snapshot; it does not scan or query devices.">Devices and entities observed on the EMS bus. Refresh reads the local snapshot; it does not scan or query devices.</p>
  <div class="ems-toolbar">
    <label><span data-i18n="Search entities">Search entities</span><input type="search" id="ems-search" class="form-control" maxlength="80"></label>
    <label><input type="checkbox" id="ems-show-unknown"> <span data-i18n="Include fields not received yet">Include fields not received yet</span></label>
    <button type="button" id="ems-refresh" class="btn btn-outline-primary" data-i18n="Refresh">Refresh</button>
  </div>
  <p id="ems-devices-status" role="status" aria-live="polite"></p>
  <div id="ems-device-list"></div>
</section>
<style>
.ems-devices{max-width:1100px;margin:auto;padding:20px;overflow-wrap:anywhere}.ems-toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin:20px 0}.ems-toolbar label{margin:0}.ems-devices details{border:1px solid #ccd9d8;border-radius:10px;margin:12px 0;background:#fff}.ems-devices summary{padding:16px;cursor:pointer;font-weight:600}.ems-device-body{padding:0 16px 16px;min-width:0}.ems-device-meta{color:#52646a}.ems-table-wrap{overflow-x:auto;max-width:100%}.ems-devices table{width:100%;border-collapse:collapse;font-size:14px}.ems-devices th,.ems-devices td{padding:9px;border-bottom:1px solid #e2e9e8;text-align:left;vertical-align:top}.ems-devices th{white-space:nowrap}.ems-devices td:first-child{min-width:180px}.ems-devices td:not(:first-child){white-space:nowrap}.ems-devices td code{color:#52646a;display:block;font-size:11px;overflow-wrap:anywhere;max-width:280px}.ems-devices .ems-value{white-space:nowrap;font-weight:600}.ems-device-status{font-weight:400;margin-left:10px;color:#52646a}.ems-devices[data-failed=true] .ems-value{color:#6b7280}.ems-warning{color:#8a5200}@media(max-width:480px){.ems-devices{padding:12px}.ems-device-body{padding:0 10px 10px}.ems-devices summary{padding:12px}}
</style>
<script>EMSDevicesPage.mount(document.getElementById('ems-devices'));</script>
