<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — OpenThermostat</title>
<style>body{font-family:system-ui,sans-serif;max-width:26rem;margin:8vh auto;padding:1.2rem;color:#17212b}label,input,button{display:block;box-sizing:border-box;width:100%;font-size:1rem}label{margin-top:1rem}input,button{padding:.8rem;margin-top:.4rem}button{background:#1558a6;color:white;border:0;border-radius:.3rem}button:disabled{opacity:.6}#message{min-height:3em}small{color:#52606d}</style>
<script src="/login.js" defer></script></head>
<body><h1>OpenThermostat</h1><h2>Sign in</h2>
<form id="login" method="post" action="/auth/login">
<label for="username">Username</label><input id="username" name="username" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
<button id="submit" type="submit">Sign in</button>
<p id="message" role="status" aria-live="polite"></p></form>
<small>This browser stays signed in for up to seven days. A device restart ends the session. Use only your trusted local network; this device currently uses HTTP.</small>
<noscript>JavaScript is required for the device interface.</noscript></body></html>
