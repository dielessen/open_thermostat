	<script type='text/javascript'>
		var hostName = "";

		function escapeHtml(str) {
			var div = document.createElement('div');
			div.appendChild(document.createTextNode(str));
			return div.innerHTML;
		}

		function HttpResponseException(message, status) {
			this.message = message;
			this.status = status;
			this.name = "HTTP Response error";
		}

		HttpResponseException.prototype.toString = function() {
			return this.name + ': ' + this.status + ' "' + this.message + '"';
		}

		function validateResponse(response) {
			if (!response.ok) {
				throw new HttpResponseException(response.statusText, response.status);
			}
			return response;
		}

		function postJSON(url, data) {
			return fetch(hostName + url, {
				method: 'post',
				cache: 'no-cache',
				credentials: 'same-origin',
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data, undefined, '\t')
			});
		}

		function getJSON(url) {
			return fetch(hostName + url)
				.then(validateResponse)
				.then(res => res.json());
		}

		function validateForm(formSelector) {
			var form = $(formSelector)[0];
			form.classList.add('was-validated');
			if (!form.checkValidity()) {
				$(formSelector).find(':invalid').first().focus();
				return false;
			}
			return true;
		}

		$(document).on('input change', '.form-control', function() {
			if (this.hasAttribute('data-no-validation')) {
				$(this).removeClass('is-valid is-invalid');
				return;
			}
			if (this.checkValidity()) {
				$(this).removeClass('is-invalid').addClass('is-valid');
			} else {
				$(this).removeClass('is-valid').addClass('is-invalid');
			}
		});
	</script>

	<script type='text/javascript'>
		var intervalID;

        function applyControlMode(status) {
            controlUiMode = status.controlMode === 'legacy' ? 'legacy'
                : status.controlMode === 'shadow' ? 'shadow' : 'unknown';
            document.querySelectorAll('[data-legacy-editor]').forEach(item => {
                item.hidden = controlUiMode !== 'legacy';
            });
            return controlUiMode;
        }
        function ensureControllerMode() {
            if (controlUiMode !== 'unknown') return Promise.resolve(controlUiMode);
            if (!controllerModePromise) controllerModePromise = getJSON('/status')
                .then(applyControlMode).finally(() => { controllerModePromise = null; });
            return controllerModePromise;
        }
        function managedControlNotice() {
            if (controlUiMode === 'unknown') {
                document.getElementById('maincontainer').textContent =
                    'Controller mode unavailable. Reload Home before editing heating settings.';
                return;
            }
            document.getElementById('maincontainer').innerHTML =
                '<div class="alert alert-info">Deze instellingen worden beheerd in Home Assistant. Configureer daar je ruimtes, programma’s en verwarming. Netwerk, toegang, firmware en herstel blijven hier bereikbaar.</div>';
        }
        function ensureChart() {
            if (typeof Chart !== 'undefined') return Promise.resolve();
            if (!chartPromise) chartPromise = new Promise((resolve,reject) => {
                const script = document.createElement('script');
                script.src = 'deps/chart.umd.js.gz';
                script.onload = () => typeof Chart !== 'undefined' ? resolve() : reject(Error('Chart unavailable'));
                script.onerror = () => reject(Error('Chart could not be loaded'));
                document.head.appendChild(script);
            }).catch(error => { chartPromise = null; throw error; });
            return chartPromise;
        }
        async function loadNativePage(page) {
            clearMainContainer();
            const navigation = navigationGeneration;
            try {
                // Recovery/network/about never depend on status-mode availability.
                const mode = legacyEditorPages.includes(page)
                    ? await ensureControllerMode() : controlUiMode;
                if (navigation !== navigationGeneration) return false;
                if (legacyEditorPages.includes(page) && mode !== 'legacy') {
                    managedControlNotice(); return false;
                }
                if (page === 'curve') await ensureChart();
                if (navigation !== navigationGeneration) return false;
                $('#maincontainer').load(page + '.html');
                return true;
            } catch (error) {
                if (navigation === navigationGeneration) {
                    document.getElementById('maincontainer').textContent =
                        'The page could not be loaded. Check the connection and try again.';
                }
                return false;
            }
        }

		$(document).ready(function () {
			$(".dropdown-item, ul > li").each(function () {

                        loadNativePage($(this).attr("data-page"));
					} else {
					}

			$("#temporaryTempModalSave").on('click', function (event) {
				event.preventDefault();


				let seconds = parseInt($('#temporaryTempModalTime').val()) * 60;
				let temperature = $('#temporaryTempModalTemperature').val() * 100;
				let roomName = $('#temporaryTempModalRoomName').text();

				fetch(hostName + '/config/temporary', {
					method: 'post',
					cache: 'no-cache',
					credentials: 'same-origin',
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						temperature: temperature,
						validSeconds: seconds,
						roomName: roomName
					}, undefined, '\t')
				})
					.then(res => {
						if ((res.status >= 200 && res.status <= 205) || res.type === "opaque") {
							// return;
						} else {
							alert("Not sure if temporary temperature set.\nStatus: " + res.status + "\nBody:\n" + res.statusText);
						}
					})
					.catch(function (error) {
						alert(error);
					});
				$('#temporaryTempModal').modal('hide');
			});


			window.addEventListener('hashchange', showLinkedPage);
			if (!showLinkedPage()) {
				mainScreen();
			}

		});

		function showLinkedPage() {
			if (location.hash !== '#network' && location.hash !== '#about') return false;
			clearMainContainer();
			loadNativePage(location.hash === '#network' ? 'network' : 'about');
			return true;
		}

		function about() {
			clearMainContainer();
			loadNativePage("about");
		}

		function mainScreen() {
			clearMainContainer();
			showRooms();
			intervalID = setInterval(function () {
				showRooms();
			}, 10000);
		}

		function clearMainContainer() {
            navigationGeneration++;
			if (intervalID) {
				clearInterval(intervalID);
			}
			var maincontainer = document.getElementById('maincontainer');
			maincontainer.innerHTML = "";
		}

		function showRooms() {
            const navigation = navigationGeneration;
			fetch(hostName + '/status')
                .then(validateResponse)
				.then(res => res.json())
				.then((out) => {
                    applyControlMode(out);
					lastLoadedStatus = out;
                    if (navigation === navigationGeneration) updateRooms(lastLoadedStatus);
					// A late poll may update mode metadata, never replace a newly navigated form.
                }).catch(() => {
                    if (navigation === navigationGeneration)
                        document.getElementById('maincontainer').textContent = 'Status unavailable. Check the connection and reload.';
                });
		}

		function showBoiler(emsStatus, boilerStatus) {
			if (Object.keys(emsStatus).length == 0) {
				return null;
			}

			// Protocol metadata can be present before either temperature is available.
			const flowValue = emsStatus.warmWaterActive ? emsStatus.currentWarmWaterTemperature : emsStatus.currentFlowTemperature;
			const setValue = emsStatus.warmWaterActive ? emsStatus.selectedWarmWaterTemperature : emsStatus.selectedFlowTemperature;
			let flowTemp = Number.isFinite(flowValue) ? (flowValue / 10).toFixed(1) : '';
			let setTemp = Number.isFinite(setValue) ? setValue.toFixed(1) : '';

			let pressure = emsStatus.pressure != null ? (emsStatus.pressure / 10).toFixed(1) : '';

			let showPump = emsStatus.pumpEnabled != null && emsStatus.pumpEnabled ? "" : "display: none";
			let showFan = emsStatus.fanEnabled != null && emsStatus.fanEnabled ? "" : "display: none";
			let showFlame = emsStatus.burningGas != null && emsStatus.burningGas ? "" : "display: none";
			let fillingSiphonOrVenting = (emsStatus.fillingSiphon != null ? emsStatus.fillingSiphon : false) || (emsStatus.pumpVenting != null ? emsStatus.pumpVenting : false);
			let displayFillingSiphonOrVenting = fillingSiphonOrVenting ? "" : "display: none";
			let displayFillingSiphonOrVentingIcon = emsStatus.fillingSiphon != null && emsStatus.fillingSiphon ? "img-siphon" : "img-bubbles";

			let heatingActive = emsStatus.heatingActive != null && emsStatus.heatingActive ? 'animation: blink 1s linear infinite alternate;' : '';
			let warmWaterActive = emsStatus.warmWaterActive != null && emsStatus.warmWaterActive ? 'animation: blink 1s linear infinite alternate;' : '';

			let burnerPower = emsStatus.currentBurnerPower != null && emsStatus.burningGas ? emsStatus.currentBurnerPower + '%' : '';

			let hasError = emsStatus.displayCode != null && emsStatus.displayCode !== '--';
			let errorCode = hasError ? escapeHtml(emsStatus.displayCode) : '';

			if (emsStatus.warmWaterEnabled != null) {
				$('#img-watertap > #img-watertap-off').css('display', emsStatus.warmWaterEnabled ? 'none' : 'inline');
			}
			if (emsStatus.heatingEnabled != null) {
				$('#img-radiator > #img-radiator-off').css('display', emsStatus.heatingEnabled ? 'none' : 'inline');
			}

			let flow = emsStatus.warmWaterFlow != null && emsStatus.warmWaterFlow > 0 ? (emsStatus.warmWaterFlow / 10).toFixed(1) : '';

			let outdoorTemperature = boilerStatus.outdoorTemperature != null ? (boilerStatus.outdoorTemperature / 100).toFixed(1) : '';

			var cont = `
		<div class='col m-1 border border-3 rounded-lg bg-light'  style='width: 9rem; height: 8rem;'>
			<div class='row d-flex justify-content-between' style="min-height: 100%">
				<div class='flex-column d-flex justify-content-between'>
					<div class='m-1' style='font-size: 0.6rem; height: 1.0rem;'><svg style='` + heatingActive + `' width="16px" height="16px"><use href="#img-radiator" /></svg></div>
					<div class='m-1' style='font-size: 0.6rem; height: 1.0rem;'><svg style='` + warmWaterActive + `' width="1rem" height="1rem"><use href="#img-watertap" /></svg></div>
				</div>
				<div class='flex-column d-flex justify-content-top' style='min-height: 100%'>
					<div class='m-1 flex-column justify-content-center' style='font-size: 0.9rem;'>
						<div class='row m-0 mb-0 justify-content-center' style='font-size: 0.6rem; height: 1.0rem;'><svg width="16px" height="16px"><use style='` + showFlame + `' href="#img-flame" /></svg></div>
						<div class='row m-0 justify-content-center' style='font-size: 0.5rem;'>` + burnerPower + `</div>
					</div>
					<div style='position: relative;'>
						<div style='` + (hasError ? 'animation: alternateA 4s ease-in-out infinite;' : '') + `'>
							<div class='row justify-content-center' style='font-size: 1.5rem; font-weight: bold;'><span>` + flowTemp + `</span><span style='font-size: 0.8rem; line-height: 1.8rem;'>` + (flowTemp.length > 0 ? '&deg;C' : '') + `</span></div>
							<div class='row justify-content-center' style='font-size: 0.8rem;'><span>` + setTemp + `</span><span style='font-size: 0.6rem; line-height: 1.1rem;'>` + (setTemp.length > 0 ? '&deg;C' : '') + `</span></div>
						</div>
` + (hasError ? `						<div style='position: absolute; top: 0; left: 0; right: 0; animation: alternateB 4s ease-in-out infinite;'>
							<div class='row justify-content-center' style='font-size: 1.5rem; font-weight: bold; color: red;'><span>` + errorCode + `</span></div>
							<div class='row justify-content-center' style='font-size: 0.8rem; color: red;'><span>` + emsStatus.serviceCode + `</span></div>
						</div>
` : '') + `					</div>
					<div class='row justify-content-center align-items-end' style='height: 100%;'>
						<div class='d-flex flex-column mb-1' style='width: 1.6rem; height: 1.0rem;' >
							<div class='m-0 text-center' style='font-size: 0.6rem; font-weight: bold; height:60%'>` + outdoorTemperature + `</div>
							<div class='m-0 text-center align-text-bottom' style='font-size: 0.4rem;'>` + (outdoorTemperature.length > 0 ? "&deg;C" : "") + `</div>
						</div>
					</div>
				</div>
				<div class='d-flex flex-column align-items-end' style='min-height: 100%'>
					<div class='m-1 ' style='font-size: 0.6rem; height: 1.0rem;'><svg width="16px" height="16px"><use style='` + showPump + `'' href="#img-pump" /></svg></div>
					<div class='m-1 ' style='font-size: 0.6rem; height: 1.0rem;'><svg width="16px" height="16px"><use style='` + showFan + `' href="#img-fan" /></svg></div>
					<div class='m-1 ' style='font-size: 0.6rem; height: 1.0rem;'><svg width="16px" height="16px"><use style='` + displayFillingSiphonOrVenting + `' href="#` + displayFillingSiphonOrVentingIcon + `" /></svg></div>

					<div class='m-1  mt-auto d-flex flex-column' style='width: 1rem; height: 1.0rem;' >
						<div class='m-0 text-center' style='font-size: 0.6rem; font-weight: bold; height:60%'>` + flow + `</div>
						<div class='m-0 text-center align-text-bottom' style='font-size: 0.4rem;'>` + (flow !== '' ? 'l/min' : '') + `</div>

					<div class='m-1  mt-bottom d-flex flex-column' style='width: 1rem; height: 1.0rem;' >

					</div>
				</div>

			</div>
		</div>
		`;


			var el = document.createElement("div");
			el.innerHTML = cont;
			return el;
		}

		function showOpenWeather(owStatus) {
			if (Object.keys(owStatus).length === 0) {
				return null;
			}
			let weather = owStatus.weather[0];

			var cont = `
		<div class='flex-column d-flex m-1 border border-3 rounded-lg bg-light justify-content-between'  style='width: 9rem; height: 8rem;'>
			<div class='flex-row d-flex mt-1 justify-content-center'>
				<div class='flex-column d-flex justify-content-top'>

					<div class='flex-row d-flex justify-content-center'><img style="width: 2.3rem; height: 2.3rem;"  src="https://openweathermap.org/img/w/` + encodeURIComponent(weather.icon) + `.png"></div>
					<div class='flex-row d-flex justify-content-center' style='font-size: 1rem; font-weight: bold;'>` + owStatus.main.temp.toFixed(1) + `&deg;C</div>
					<div class='flex-row d-flex justify-content-center' style='font-size: 0.5rem;'>` + (owStatus.main.feels_like).toFixed(1) + `&deg;C</div>

				<div class="ml-1 d-flex justify-content-end align-items-center">
					<div class='flex-column d-flex align-items-center'><svg width="0.7rem" height="0.7rem"><use href="#img-humidity" /></svg></div>

					<div class='flex-column d-flex align-items-center'><svg width="0.7rem" height="0.7rem"  viewBox="0 0 32 32"><path transform="rotate (-`+ owStatus.wind.deg + ` 16 16)" d="m26.934 28.641-10-26a1 1 0 0 0-1.868 0l-10 26A1 1 0 0 0 6.6 29.8l9.4-7.05 9.4 7.05a1 1 0 0 0 1.533-1.159z" style="fill: black;"/></svg></div>
					<div class='flex-column d-flex align-items-center'>&nbsp;` + (owStatus.wind.speed * 3.6).toFixed(0) + ` km/h</div>
				</div>

			var el = document.createElement("div");

			return el;

        // Read-only dashboard. No new polling, commands, scheduler or chart dependency.
        var installationHistory = Object.create(null), installationHistoryBoot = null;
        function dashboardText(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }
        function dashboardNumber(value, divisor, min, max) {
            if (typeof value !== 'number' || !Number.isFinite(value)) return null;
            value /= divisor || 1;
            return value >= min && value <= max ? value : null;
        }
        function dashboardValue(value, unit, digits) {
            return value === null ? '<span class="pd-missing">Niet beschikbaar</span>' :
                dashboardText(value.toFixed(digits == null ? 1 : digits)) + '<small> ' + dashboardText(unit) + '</small>';
        }
        function dashboardBool(value, yes, no) {
            return value === true ? yes : value === false ? no : 'Niet beschikbaar';
        }
        function dashboardBuildSupport(build) {
            var html = '<details class="pd-panel pd-build"><summary>Koppeling met Home Assistant</summary>';
            if (!build || build.schema !== 1 || build.scope !== 'compiled_support_only' ||
                build.requires_local_source_selection !== true || build.authorizes_physical_outputs !== false ||
                !Array.isArray(build.plans)) {
                return html + '<p>Deze firmware meldt nog geen herkenbare softwareondersteuning voor de kamerregeling. Controleer de firmwareversie voordat je de koppeling instelt.</p></details>';
            }
            var week = build.plans.slice(0,4).find(function(plan) {
                return plan && plan.contract === 'control.plan.week.v1' &&
                    Number.isInteger(plan.minimum_zones) && plan.minimum_zones === 1 &&
                    Number.isInteger(plan.maximum_zones) && plan.maximum_zones >= 1 && plan.maximum_zones <= 8;
            });
            if (week) {
                html += '<p>Deze firmware bevat ondersteuning voor kamerdoelen en weekprogramma’s voor maximaal '+week.maximum_zones+' ruimtes via deze koppeling.</p>';
            } else {
                html += '<p>Ondersteuning voor het complete kamerweekprogramma is niet bevestigd door deze firmware.</p>';
            }
            return html + '<p class="pd-help">Softwareondersteuning betekent nog niet dat Home Assistant gekoppeld is of dat de configuratie is toegepast. De actuele regelstatus staat hierboven. Deze informatie geeft geen toestemming voor het aansturen van kranen of ketel.</p></details>';
        }
        function dashboardRoomName(row,index) {
            var encoded = row && row.name_utf8_hex;
            if (typeof encoded === 'string' && /^(?:[0-9a-f]{2}){1,80}$/.test(encoded)) {
                try {
                    var decoded = decodeURIComponent(encoded.replace(/../g,function(pair){return '%'+pair;}));
                    if (decoded.trim() && !/[\x00-\x1f\x7f]/.test(decoded)) return decoded;
                } catch (error) {}
            }
            return row && typeof row.name === 'string' && row.name.trim() ? row.name.slice(0,80) : 'Ruimte '+(index+1);
        }
        function dashboardReason(value) {
            var reasons = {
                shadow_idle:'Geen berekende warmtevraag', shadow_demand:'Ruimte vraagt warmte',
                sensor_stale:'Temperatuurmeting is verouderd', sensor_unavailable:'Geen geldige temperatuurmeting',
                sample_stale:'Temperatuurmeting is verouderd', no_sample:'Wacht op een temperatuurmeting',
                adapter_offline:'Verbinding met Home Assistant ontbreekt', lease_expired:'Verbinding verlopen',
                time_not_valid:'Tijd nog niet betrouwbaar', time_invalid:'Tijd nog niet betrouwbaar',
                stopped:'Regeling gestopt', off:'Ruimte uitgeschakeld', summer:'Zomerbedrijf',
                window_open:'Raam staat open', dhw_active:'Tapwater heeft voorrang',
                limits_unknown:'Installatiegrenzen nog niet bevestigd', no_fresh_local_safety:'Installatievoorwaarden nog niet bevestigd',
                unqualified:'Installatievoorwaarden nog niet bevestigd', idle:'Geen warmtevraag',
                awaiting_readiness:'Wacht op een beschikbaar afgiftepad',
                hydraulic_profile_unqualified:'Installatieprofiel nog niet bevestigd',
                adapter_unavailable:'Verbinding met Home Assistant ontbreekt',
                source_unavailable:'Geen geldige meet- of programmabron',
                fault_state_unknown:'Storingsstatus van de ketel nog onbekend',
                dhw_state_unknown:'Tapwaterstatus nog onbekend', dhw_priority:'Tapwater heeft voorrang',
                no_demand:'Geen berekende warmtevraag', stop:'Regeling gestopt',
                water_target_invalid:'Berekend waterdoel ligt buiten de installatiegrenzen',
                postrun:'Naloop na warmtevraag', logical_demand:'Berekende warmtevraag',
                shadow_seasonal_demand:'Berekende warmtevraag',
                shadow_low_load_or_satisfied:'Temperatuur bereikt of warmtevraag te laag',
                seasonal_target_or_sensor_invalid:'Temperatuurmeting of doel niet geldig',
                shadow_frost_advice:'Vorstbeschermingsadvies; geen bevestigde aansturing'
            };
            return Object.prototype.hasOwnProperty.call(reasons,value) ? reasons[value] : 'Bekijk de toelichting in Home Assistant';
        }
        function recordDashboardRooms(control, rows) {
            var state = control.state, at = control.captured_at_ms;
            if (!control.fresh || !state || !Number.isSafeInteger(at) || at < 0) return;
            var boot = String(state.boot_id || 'unknown');
            if (boot !== installationHistoryBoot) {
                installationHistory = Object.create(null); installationHistoryBoot = boot;
            }
            var retained = Object.create(null);
            rows.forEach(function(row, index) {
                var id = typeof row.zone_id === 'string' && /^[a-f0-9]{8}$/.test(row.zone_id) ? row.zone_id : 'room_' + index;
                var actual = dashboardNumber(row.temperature_centi_c, 100, -50, 80);
                var target = dashboardNumber(row.target_centi_c, 100, 5, 35);
                var series = installationHistory[id] || [];
                if (series.length && (at < series[series.length-1][0] || at-series[series.length-1][0] > 15000)) series = [];
                if (actual !== null || target !== null) {
                    var point = [at, actual, target];
                    if (series.length && at === series[series.length-1][0]) series[series.length-1] = point;
                    else { series.push(point); if (series.length > 60) series.shift(); }
                }
                retained[id] = series;
            });
            installationHistory = retained; // Removed rooms cannot accumulate browser memory.
        }
        function dashboardTrend(row, index) {
            var id = typeof row.zone_id === 'string' && /^[a-f0-9]{8}$/.test(row.zone_id) ? row.zone_id : 'room_' + index;
            var points = installationHistory[id] || [];
            if (points.length < 2) return '<p class="pd-help">De trend verschijnt na twee terugmeldingen.</p>';
            var numbers = [];
            points.forEach(function(p) { if (p[1] !== null) numbers.push(p[1]); if (p[2] !== null) numbers.push(p[2]); });
            if (!numbers.length) return '';
            var low = Math.min.apply(null,numbers), high = Math.max.apply(null,numbers), range = Math.max(1,high-low);
            var first = points[0][0], span = Math.max(1,points[points.length-1][0]-first);
            function line(column) {
                var pen = false, path = '';
                points.forEach(function(p) {
                    if (p[column] === null) {pen = false;return;}
                    path += (pen?'L':'M') + (6+(p[0]-first)/span*248).toFixed(1) + ',' + (50-(p[column]-low)/range*40).toFixed(1) + ' ';
                    pen = true;
                });
                return path;
            }
            return '<svg class="pd-trend" viewBox="0 0 260 56" role="img" aria-label="Recente temperatuurterugmelding en doel"><path d="'+line(2)+'" class="pd-target-line"/><path d="'+line(1)+'" class="pd-actual-line"/></svg>'+
                '<p class="pd-help">Doorgetrokken: gemeld · gestippeld: doel · '+Math.max(1,Math.round(span/1000))+' s</p>';
        }
        function renderInstallationDashboard(status) {
            var control = status.control || {}, ems = status.ems || {};
            var state = control.fresh === true && control.state && typeof control.state === 'object' && !Array.isArray(control.state) && Array.isArray(control.state.zones) ? control.state : null;
            var rows = state && Array.isArray(state.zones) ? state.zones.slice(0,8).filter(function(r){return r && typeof r === 'object' && !Array.isArray(r);}) : [];
            recordDashboardRooms(control,rows);
            var supervisor = state && state.supervisor || {};
            var demand = typeof supervisor.requested_heat === 'boolean' ? supervisor.requested_heat : null;
            var boilerEnabled = state && typeof state.boiler_output_enabled === 'boolean' ? state.boiler_output_enabled : null;
            var actuatorEnabled = state && typeof state.actuator_output_enabled === 'boolean' ? state.actuator_output_enabled : null;
            var mode = ems.warmWaterActive === true ? 'Tapwater' : ems.heatingActive === true ? 'CV actief' :
                ems.warmWaterActive === false && ems.heatingActive === false ? 'Geen CV of tapwater' : 'Wacht op ketelgegevens';
            var age = typeof control.age_ms === 'number' && Number.isFinite(control.age_ms) ? Math.max(0,Math.round(control.age_ms/1000)) : null;
            var freshText = state ? 'Regelstatus ontvangen'+(age === null?'':' · bij ophalen '+age+' s oud') :
                control.reason === 'stale' ? 'Regelstatus verouderd' : 'Wacht op regelstatus';
            function fact(label,value,unit,hint) {
                return '<article class="pd-fact"><h3>'+label+'</h3><div class="pd-value">'+dashboardValue(value,unit)+'</div><p class="pd-help">'+hint+'</p></article>';
            }
            var html = '<section class="product-dashboard" lang="nl" aria-label="Installatieoverzicht">'+
                '<header class="pd-heading"><div><p class="pd-eyebrow">OpenThermostat · E32</p><h1>Je verwarmingsinstallatie</h1><p>Ketelgegevens en warmtevraag, op één plek.</p></div><span class="pd-badge">Beheerd via Home Assistant</span></header>'+
                '<div class="pd-status"><strong>'+dashboardText(mode)+'</strong><span>'+dashboardText(freshText)+'</span></div>'+
                '<div class="pd-facts">'+
                fact('Aanvoer · gemeld',dashboardNumber(ems.currentFlowTemperature,10,-20,150),'°C','Terugmelding van de ketel.')+
                fact('Keteldoel · teruggelezen',dashboardNumber(ems.selectedFlowTemperature,1,0,150),'°C','Gerapporteerd setpoint; geen bewijs van een nieuwe opdracht.')+
                fact('Modulatie · gemeld',dashboardNumber(ems.currentBurnerPower,1,0,100),'%','Branderpercentage uit de telemetrie; geen gemeten verbruik.')+
                fact('Installatiedruk',dashboardNumber(ems.pressure,10,0,10),'bar','Alleen zichtbaar wanneer het toestel dit rapporteert.')+
                '</div><section class="pd-panel"><div class="pd-section-title"><div><h2>Van ruimtes naar ketel</h2><p class="pd-help">Een berekende aanvraag en werkelijke aansturing blijven apart.</p></div></div>'+
                '<div class="pd-flow"><div><span class="pd-flow-label">Ruimtes</span><strong>'+(state?rows.filter(function(r){return r.demand===true;}).length+' vragen warmte':'Nog geen geldige terugmelding')+'</strong></div><span class="pd-arrow" aria-hidden="true">→</span><div><span class="pd-flow-label">Gezamenlijke berekening</span><strong>'+dashboardBool(demand,'Warmtevraag','Geen warmtevraag')+'</strong></div><span class="pd-arrow pd-dashed" aria-hidden="true">⇢</span><div><span class="pd-flow-label">Ketelaansturing</span><strong>'+dashboardBool(boilerEnabled,'Vrijgegeven','Geblokkeerd')+'</strong></div></div>'+
                '<p class="pd-help">'+(state?dashboardText(dashboardReason(supervisor.reason)):'Configureer je installatie in Home Assistant. Hier verschijnt de werkelijke regelstatus zodra de koppeling is bevestigd.')+'</p></section>'+
                '<div class="pd-section-title"><h2>Warmtevraag per ruimte</h2><span class="pd-help">Bediening en programma’s in Home Assistant</span></div><div class="pd-rooms">';
            if (!rows.length) html += '<div class="pd-empty">'+(state?'Er zijn nog geen ruimtes in de teruggelezen configuratie.':'Geen actuele regelstatus beschikbaar. Oude lokale E32-kamers worden hier niet als nieuwe ruimtes getoond.')+'</div>';
            rows.forEach(function(row,index) {
                var name = dashboardRoomName(row,index);
                var actual = dashboardNumber(row.temperature_centi_c,100,-50,80), target = dashboardNumber(row.target_centi_c,100,5,35);
                html += '<article class="pd-room"><div class="pd-room-title"><h3>'+dashboardText(name)+'</h3><span class="pd-badge'+(row.demand===true?' pd-request':'')+'">'+dashboardBool(row.demand,'Vraagt warmte','Geen aanvraag')+'</span></div><div class="pd-room-temperatures"><div><span class="pd-flow-label">Gemeld</span>'+dashboardValue(actual,'°C')+'</div><div><span class="pd-flow-label">Doel</span>'+dashboardValue(target,'°C')+'</div></div><p class="pd-help">'+dashboardText(dashboardReason(row.reason))+'</p>'+dashboardTrend(row,index)+
                    '<details class="pd-room-detail"><summary>Details</summary><p>Ruimte-ID: '+dashboardText(row.zone_id || 'niet gemeld')+'<br>Redencode: '+dashboardText(row.reason || 'niet gemeld')+'<br>Aansturing kranen: '+dashboardBool(actuatorEnabled,'vrijgegeven','geblokkeerd')+'</p><p class="pd-help">Een aanvraag bewijst geen klepstand of geleverde warmte. Instellingen en programma’s pas je aan in Home Assistant.</p></details></article>';
            });
            html += '</div><div class="pd-lower"><section class="pd-panel"><h2>Opdrachten aan de ketel</h2><p>'+dashboardBool(boilerEnabled,'Aansturing is volgens de regeling vrijgegeven.','De regeling meldt geblokkeerde uitgangen.')+'</p><p class="pd-help">Er is nog geen bevestigde opdrachtentijdlijn beschikbaar. Berekende kamervraag wordt niet als een verzonden of uitgevoerde ketelopdracht gepresenteerd.</p></section>'+
                '<details class="pd-panel"><summary>Alle beschikbare ketelgegevens</summary><dl class="pd-detail-grid">';
            var labels = {protocolProfile:'Protocolprofiel',protocolVersion:'Protocolversie',displayCode:'Displaycode',serviceCode:'Servicecode'};
            Object.keys(labels).forEach(function(key) {var value=ems[key];html+='<dt>'+labels[key]+'</dt><dd>'+dashboardText(value==null?'Niet beschikbaar':String(value).slice(0,80))+'</dd>';});
            var booleans = {heatingEnabled:'CV ingeschakeld',heatingActive:'CV actief',warmWaterEnabled:'Tapwater ingeschakeld',warmWaterActive:'Tapwater actief',burningGas:'Vlamstatus',pumpEnabled:'Pomp',fanEnabled:'Ventilator',pumpVenting:'Pomp ontluchten',fillingSiphon:'Sifon vullen'};
            Object.keys(booleans).forEach(function(key){html+='<dt>'+booleans[key]+'</dt><dd>'+dashboardBool(ems[key],'Aan','Uit')+'</dd>';});
            [['currentWarmWaterTemperature','Tapwater · gemeld',10,-20,150,'°C'],['selectedWarmWaterTemperature','Tapwaterdoel · teruggelezen',1,0,150,'°C'],['warmWaterFlow','Tapwaterdebiet',10,0,100,'L/min'],['outdoorTemperature','Buitentemperatuur · ketelbron',100,-60,60,'°C']].forEach(function(item){html+='<dt>'+item[1]+'</dt><dd>'+dashboardValue(dashboardNumber(ems[item[0]],item[2],item[3],item[4]),item[5])+'</dd>';});
            html += '</dl><p class="pd-help">Niet beschikbaar betekent niet ondersteund, ontbrekend of verlopen; een gemeten nul blijft nul. Telemetrie is geen onafhankelijke fysieke vlam- of warmtemeting.</p></details>'+dashboardBuildSupport(status.control_build)+'</div></section>';
            document.getElementById('maincontainer').innerHTML = html;
        }

		function updateRooms(status) {
            applyControlMode(status);
			var maincontainer = document.getElementById('maincontainer');
			if (status.controlMode === 'shadow') {
                renderInstallationDashboard(status);
				return;
			}

			var mainColElement = document.createElement('div');
			mainColElement.classList.add('flex-column');
			mainColElement.classList.add('d-flex');
			mainColElement.classList.add('justify-content-between');
			mainColElement.classList.add('align-items-center');


			var tilesBoxElement = document.createElement('div');
			tilesBoxElement.classList.add('row');
			tilesBoxElement.classList.add('d-flex');
			tilesBoxElement.classList.add('w-100');
			tilesBoxElement.classList.add('justify-content-center');

			status.rooms.forEach(element => {
				tilesBoxElement.appendChild(showRoom(element, status.boiler, status.activeProgram));
			});

			let boiler = showBoiler(status.ems, status.boiler)
			if (boiler) {
				tilesBoxElement.appendChild(boiler);
			}

			let ow = showOpenWeather(status.openweather);
			if (ow) {
				tilesBoxElement.appendChild(ow);
			}

			mainColElement.append(tilesBoxElement);

			let uptime = `<div class='align-self-end' style='font-size: 0.6rem;'>
			Time: ` + status.time + ` uptime: ` + parseInt(status.uptime / 86400) + `d ` + parseInt(status.uptime % 86400 / 3600) + `h ` + parseInt(status.uptime % 3600 / 60) + `m ` + status.uptime % 60 + `s
		</div>`;


			var timeElement = document.createElement('div');
			timeElement.classList.add('flex-row');
			timeElement.classList.add('d-flex');
			timeElement.classList.add('w-100');
			timeElement.classList.add('justify-content-center');
			timeElement.classList.add('align-items-end');
			timeElement.innerHTML = uptime;
			mainColElement.append(timeElement);


			maincontainer.innerHTML = "";
			maincontainer.append(mainColElement);
		}

		function showRoom(room, boilerStats, activeProgram) {
			let heating = room.shouldContinueHeating && boilerStats.boiler;
			if (consoleLog) console.log(room.name + " heating: " + heating);

			var heatingIcon = "";
			if (!room.enabled) {
				heatingIcon = `<svg width="16px" height="16px"><use href="#img-power"></svg>`;
			} else if (heating) {
				heatingIcon = `<svg width="16px" height="16px"><use style='' href="#img-flame" /></svg>`
			}

			let setTemp = (room.tempSet / 100).toFixed(2);
			let meanTemp = (room.meanTemp !== undefined) ? (room.meanTemp / 100).toFixed(2) : '-';
			let currentHumidity = (room.currentHumidity !== undefined) ? (room.currentHumidity / 100).toFixed(1) + '%' : '';
			let batteryLevel = (room.batteryLevel !== undefined && room.batteryLevel >= 0) ? room.batteryLevel + '%' : '';

			let humidityVisibility = (room.currentHumidity !== undefined) ? '' : 'visibility: hidden;'
			let batteryVisibility = (room.batteryLevel !== undefined && room.batteryLevel >= 0) ? '' : 'visibility: hidden;'


			let programName = activeProgram;
			if (room.currentProgram !== undefined && room.currentProgram !== null) {
				programName = room.currentProgram;
			}
			if (room.temporaryProgramSecondsLeft > 0) {
				programName = "Temporary (" + getTimeLeftFromSecs(room.temporaryProgramSecondsLeft) + ")";
			}

			let lowBatteryStyle = '';
			if (room.batteryLevel !== undefined && room.batteryLevel < 6) {
				lowBatteryStyle = 'fill: red; animation: blink 1s linear infinite alternate;';
			}

			var cont = `
			<div class='col m-1 border border-3 rounded-lg bg-light' onclick='setTemporaryTemp(event, "` + escapeHtml(room.name) + `");' style='width: 9rem; height: 8rem;'>
				<div class='row justify-content-center' style='font-size: 0.9rem;'>` + escapeHtml(room.name) + `</div>
				<div class='row justify-content-center' style='font-size: 1.5rem; font-weight: bold;'>` + meanTemp + `&deg;C</div>
				<div class='row justify-content-center' style='font-size: 0.8rem;'>` + setTemp + `&deg;C</div>
				<div class='row mb-3 justify-content-center' style='font-size: 0.6rem;'>` + escapeHtml(programName) + `</div>
				<div class='row d-flex justify-content-between' style='height: 1.0rem;'>
					<div class='ml-1' style='font-size: 0.6rem; height: 1.0rem; width: 3rem; display: flex; justify-content: flex-start;  align-items: center; ` + humidityVisibility + `'><svg viewBox="0 0 4.2333 4.2333" style="height: 0.7rem;"><path d="m1.8871 0.27523c-0.37917 0.56261-0.80901 1.1306-1.0408 1.7744-0.93792 2.6049 3.277 2.8553 2.5517 0.33054-0.20597-0.7169-1.0431-1.6366-1.3761-2.2757l-0.13472 0.17081m-0.938 2.4606c0.037288 0.26239 0.15761 0.47453 0.30894 0.64822 0.3167 0.2848 0.51096 0.32871 0.8065 0.43986-0.47881 0.099642-1.2481-0.55694-1.1154-1.0881z" fill="#090909"/></svg>` + currentHumidity + `</div>
					<div style='font-size: 0.6rem; height: 1.0rem;'>` + heatingIcon + `</div>
					<div class='mr-1' style='font-size: 0.6rem; height: 1.0rem; width: 3rem; display: flex; justify-content: flex-end;  align-items: center;` + batteryVisibility + `'>` + batteryLevel + `<svg viewBox="0 0 4.2333 4.2333"  style="height: 0.7rem; ` + lowBatteryStyle + `"><path d="m2.1263 4.0871h-1.1848v-3.5545h0.59242v-0.39495h1.1848v0.39495h0.59242v3.5545zm0-1.7773h0.7899v-1.3823h-0.55951l-0.00128-0.40485-0.23065-0.009105-0.22803-0.008038-8.21e-4 0.42199h-0.5595v1.3823z" stroke-width=".19748"/></svg></div>
				</div>
			</div>
		`;

			var roomElement = document.createElement('div');
			roomElement.innerHTML = cont;
			return roomElement;

		}

		function setTemporaryTemp(event, roomName) {
			$('#temporaryTempModalRoomName').text(roomName);
			lastLoadedStatus.rooms.forEach(element => {
				if (element.name === roomName) {
					$('#temporaryTempModalTemperature').val(element.tempSet / 100).trigger('input');
				}
			});
			$('#temporaryTempModal').modal('show');
		}

		function getTimeLeftFromSecs(val) {
			let hours = 0, minutes = 0, seconds = 0, left = val;
			hours = Math.floor(left / 3600);
			left = left - (hours * 3600);
			minutes = Math.floor(left / 60);
			left = left - (minutes * 60);
			seconds = left;
			time = "";
			if (hours > 0) {
				time += hours + "h ";
			}
			if (minutes > 0) {
				time += minutes + "m ";
			}
			if (seconds > 0) {
				time += seconds + "s";
			}
			return time;
		}

		function updateTemporaryTempModalTimeText(val) {
			$('#temporaryTempModalTimeText').val(getTimeLeftFromSecs(val * 60));
		}

		function updateTemporaryTempModalTemperature(val) {
			$('#temporaryTempModalTemperatureText').val(val + '°C');
		}

	</script>
