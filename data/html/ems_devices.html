<section id="ems-devices" class="ems-devices">
  <h2 data-i18n="All boiler data">All boiler data</h2>
  <p class="pd-help" data-i18n="Everything the E32 receives from the EMS bus, per device. Settings marked as configurable can be changed here.">Everything the E32 receives from the EMS bus, per device. Settings marked as configurable can be changed here.</p>
  <div class="ems-toolbar">
    <label><span data-i18n="Search entities">Search entities</span><input type="search" id="ems-search" class="form-control" maxlength="80"></label>
    <label><span data-i18n="Access">Access</span><select id="ems-access" class="form-control">
      <option value="all" data-i18n="All entities">All entities</option>
      <option value="read" data-i18n="Read only">Read only</option>
      <option value="write" data-i18n="Configurable settings">Configurable settings</option>
      <option value="command" data-i18n="Manual trial only">Manual trial only</option>
    </select></label>
    <button type="button" id="ems-refresh" class="btn btn-outline-primary" data-i18n="Refresh">Refresh</button>
  </div>
  <p id="ems-devices-status" role="status" aria-live="polite"></p>
  <div id="ems-device-list"></div>
  <details id="ems-unidentified" hidden><summary data-i18n="Unidentified EMS traffic">Unidentified EMS traffic</summary><p data-unidentified-traffic class="ems-device-meta"></p></details>
  <p id="ems-settings-status" role="status" aria-live="polite"></p>
  <p id="ems-settings-operation" role="status" aria-live="polite"></p>
  <div id="ems-settings-editor" class="ems-editor" hidden></div>
</section>
<style>
.ems-devices{max-width:1100px;margin:auto;overflow-wrap:anywhere}.ems-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:12px 0}.ems-toolbar label{margin:0;max-width:100%}.ems-devices details{border:1px solid var(--ot-border);border-radius:var(--ot-r1);margin:10px 0;background:var(--ot-surface)}.ems-devices summary{padding:10px 16px}.ems-device-body{padding:0 16px 16px;min-width:0}.ems-device-meta,.ems-device-status,.ems-devices td code{color:var(--ot-muted);font-size:.85rem}.ems-table-wrap{overflow-x:auto;max-width:100%}.ems-devices table{width:100%;border-collapse:collapse;font-size:14px}.ems-devices th,.ems-devices td{padding:8px 10px;border-bottom:1px solid var(--ot-border);text-align:left;vertical-align:top}.ems-devices td:first-child{min-width:150px}.ems-devices td code{display:block;font-size:11px}.ems-devices td:nth-child(4){color:var(--ot-warn);font-weight:600}.ems-value{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.ems-device-status{font-weight:400;margin-left:10px}.ems-access{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin:0 6px 6px 0;background:var(--ot-accent-soft);color:var(--ot-accent)}.ems-access[data-access=command]{background:var(--ot-warn-bg);color:var(--ot-warn)}.ems-editor{padding:16px;border:1px solid var(--ot-border);border-radius:var(--ot-r1)}.ems-editor label{display:block;margin:12px 0}.ems-editor select,.ems-editor input[type=number]{max-width:320px}.ems-editor input[type=checkbox]{margin-right:8px}@media(max-width:600px){.ems-device-body{padding:0 10px 10px}.ems-devices summary{padding:10px 12px}.ems-devices thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.ems-devices tbody,.ems-devices tr{display:block}.ems-devices tr{padding:10px 0;border-bottom:1px solid var(--ot-border)}.ems-devices td{display:block;min-width:0!important;border:0;padding:3px 0}.ems-devices td:empty{display:none}.ems-device-status{display:block;margin:6px 0 0}}
</style>
