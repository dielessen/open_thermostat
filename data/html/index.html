	<script type='text/javascript'>
		var hostName = "";

		function escapeHtml(str) {
			var div = document.createElement('div');
			div.appendChild(document.createTextNode(str));
			return div.innerHTML;
		}

		function HttpResponseException(message, status) {
			this.message = message;
			this.status = status;
			this.name = uiText("HTTP Response error");
		}

		HttpResponseException.prototype.toString = function() {
			return this.name + ': ' + this.status + ' "' + this.message + '"';
		}

		function validateResponse(response) {
			if (!response.ok) {
				throw new HttpResponseException(response.statusText, response.status);
			}
			return response;
		}

		function postJSON(url, data) {
			return fetch(hostName + url, {
				method: 'post',
				cache: 'no-cache',
				credentials: 'same-origin',
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data, undefined, '\t')
			});
		}

		function getJSON(url) {
			return fetch(hostName + url)
				.then(validateResponse)
				.then(res => res.json());
		}

		function validateForm(formSelector) {
			var form = $(formSelector)[0];
			form.classList.add('was-validated');
			if (!form.checkValidity()) {
				$(formSelector).find(':invalid').first().focus();
				return false;
			}
			return true;
		}

		$(document).on('input change', '.form-control', function() {
			if (this.hasAttribute('data-no-validation')) {
				$(this).removeClass('is-valid is-invalid');
				return;
			}
			if (this.checkValidity()) {
				$(this).removeClass('is-invalid').addClass('is-valid');
			} else {
				$(this).removeClass('is-valid').addClass('is-invalid');
			}
		});
	</script>

a,a:hover{color:var(--ot-accent)}:focus-visible{outline:3px solid var(--ot-focus)!important;outline-offset:2px}
.text-muted,.form-text,small,.small{color:var(--ot-muted)!important}.text-danger{color:var(--ot-err)!important}
.card,.modal-content,.dropdown-menu,.list-group-item{background:var(--ot-surface);color:var(--ot-text);border-color:var(--ot-border)}.card{border-radius:var(--ot-r2);overflow:hidden}

.table{color:var(--ot-text)}.table td,.table th{border-color:var(--ot-border)!important}code{color:var(--ot-accent)}

.dropdown-item{color:var(--ot-text);padding:10px 16px}.dropdown-item:hover,.dropdown-item:focus,.dropdown-item.active{background:var(--ot-surface-2);color:var(--ot-text)}.dropdown-item.active{box-shadow:inset 3px 0 var(--ot-accent)}.dropdown-divider{border-color:var(--ot-border)}
.btn{min-height:var(--ot-tap);border-radius:var(--ot-r1);font-weight:600}.btn:hover{filter:brightness(1.06)}
.btn-primary,.btn-success{background:var(--ot-accent)!important;border-color:var(--ot-accent)!important;color:var(--ot-accent-ink)!important}

</style>

        const pageScripts = new Map();
        const legacyEditorPages = ['program','room_management','room_setup','curve','hardware','rooms'];

        function applyControlMode(status) {
            controlUiMode = status.controlMode === 'legacy' ? 'legacy'
                : status.controlMode === 'shadow' ? 'shadow' : 'unknown';
            document.querySelectorAll('[data-legacy-editor]').forEach(item => {
                item.hidden = controlUiMode !== 'legacy';
            });
            return controlUiMode;
        }
        function ensureControllerMode() {
            if (controlUiMode !== 'unknown') return Promise.resolve(controlUiMode);
            if (!controllerModePromise) controllerModePromise = getJSON('/status')
                .then(applyControlMode).finally(() => { controllerModePromise = null; });
            return controllerModePromise;
        }
        function managedControlNotice() {
            if (controlUiMode === 'unknown') {
                document.getElementById('maincontainer').textContent =
                    uiText("Controller mode unavailable. Reload Home before editing heating settings.");
                return;
            }
            document.getElementById('maincontainer').innerHTML =
                uiHtml("<div class=\"alert alert-info\">These settings are managed in Home Assistant. Configure your rooms, programs and heating there. Network, access, firmware and recovery remain accessible here.</div>");
        }
        function ensureChart() {
            if (typeof Chart !== 'undefined') return Promise.resolve();
            if (!chartPromise) chartPromise = new Promise((resolve,reject) => {
                const script = document.createElement('script');
                script.src = 'deps/chart.umd.js.gz';
                script.onload = () => typeof Chart !== 'undefined' ? resolve() : reject(Error(uiText("Chart unavailable")));
                script.onerror = () => reject(Error(uiText("Chart could not be loaded")));
                document.head.appendChild(script);
            }).catch(error => { chartPromise = null; throw error; });
            return chartPromise;
        }
        function ensurePageScript(src, ready) {
            if (ready()) return Promise.resolve();
            if (pageScripts.has(src)) return pageScripts.get(src);
            const pending = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const finish = error => {
                    clearTimeout(timer);
                    script.onload = script.onerror = null;
                    if (error) { script.remove(); reject(error); }
                    else resolve();
                };
                const timer = setTimeout(() => finish(Error('Page script timeout')), 10000);
                script.src = src;
                script.onload = () => finish(ready() ? null : Error('Page script unavailable'));
                script.onerror = () => finish(Error('Page script could not be loaded'));
                document.head.appendChild(script);
            }).catch(error => { pageScripts.delete(src); throw error; });
            pageScripts.set(src, pending);
            return pending;
        }
        async function ensurePageScripts(page) {
            if (page === 'boiler_test') {
                // Reference metadata is optional; received values remain usable
                // if its download fails. Retry it on a subsequent visit.
                await ensurePageScript('/ems-metadata.js', () => !!window.OT_EMS_METADATA)
                    .catch(() => {});
                await ensurePageScript('/ems-devices.js', () => !!window.EMSDevicesPage);
            } else if (page === 'bluetooth') {
                await ensurePageScript('/bluetooth.js', () => !!window.BluetoothPage);
            } else if (page === 'system_log') {
                await ensurePageScript('/system-log.js', () => !!window.SystemLogPage);
            } else if (page === 'heating') {
                // The visual week planner is optional: without it the rooms page keeps its switch-point list.
                await ensurePageScript('/week-editor.js', () => !!window.OTWeekEditor).catch(() => {});
            } else if (page === 'curve') await ensureChart();

        const pageRoutes = {heating:'rooms', boiler_test:'boiler', boiler_display:'boiler-model', boiler_trial:'boiler-trial', bluetooth:'sensors', network:'settings', update:'update', system_log:'log', about:'about'};
        const pageTitles = {home:"Overview", heating:"Rooms", boiler_test:"Boiler", bluetooth:"Sensors", network:"Settings", update:"Firmware update", system_log:"System log", about:"About"};
        function markPage(page) {
            try {
                document.title = uiText(pageTitles[page] || "System") + ' · OpenThermostat';
                document.querySelectorAll('[data-nav]').forEach(link => {
                    const current = link.getAttribute('data-nav') === page;
                    link.classList.toggle('active', current);
                    if (current) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
                });
                document.getElementById('navbarDropdownMenuLink').classList.toggle('active', !pageTitles[page] || ['update','system_log','about'].includes(page));

        function routePage() {
            const name = location.hash.slice(1);
            // #network: saved links from before the Settings page had its own menu item.
            const page = Object.keys(pageRoutes).find(key => pageRoutes[key] === name) ||
                (name === 'network' ? 'network' : null) ||
                (legacyEditorPages.concat(['ems_devices']).includes(name) ? name : null);

                (state && !engine?uiText("There are no rooms in the configuration read back yet."):uiText("Set up rooms on the Rooms page, or connect Home Assistant."))+
                (engine?'<br><a class="btn btn-primary mt-2" href="#rooms" data-page="heating">'+uiText("Add room")+'</a>':'')+'</div>';
            var trendPending = false;
            cards.forEach(function(c) {
                // The E32's 24 h history (RAM, since restart) when it has this room; else the live trend.
                var trend = c.off ? '' : (engine && dashboardHistory && c.id.indexOf('e32:') === 0 ? OpenThermostatHistory.room(dashboardHistory,c.id.slice(4),c.name) : '') || dashboardTrend(c.id); if (!trend && !c.off) trendPending = true;
                html += '<article class="pd-room" data-dashboard-key="'+dashboardText(c.key)+'"><div class="pd-room-title"><h3>'+dashboardText(c.name)+'</h3><span class="ot-chips">'+
                    (c.off ? '' : chip(dashboardBool(c.demand,uiText("Requesting heat"),uiText("No request")),c.demand===true?'ok':''))+c.chips+'</span></div>'+
                    (c.off ? '<p class="pd-room-off">'+uiText("Off: this room never asks for heat.")+' <a href="#rooms" data-page="heating">'+uiText("Change or remove on the Rooms page")+'</a></p>' :
                    uiHtml("<div class=\"pd-room-temperatures\"><div><span class=\"pd-flow-label\">Now</span>")+dashboardValue(c.actual,'°C')+uiHtml("</div><div><span class=\"pd-flow-label\">Target</span>")+dashboardValue(c.target,'°C')+'</div></div>')+
                    (c.help?'<p class="pd-help">'+dashboardText(c.help)+'</p>':'')+trend+(c.comfort||'')+
                    uiHtml("<details class=\"pd-room-detail\"><summary>Technical details</summary>")+c.details+'</details></article>';
            });
            html += '</div>'+(trendPending && cards.length ? uiHtml("<p class=\"pd-help\" data-dashboard-key=\"trend-hint\">The trend appears after two reports.</p>") : '')+
                (engine && dashboardHistory ? (function(chart) { return chart ? '<section class="pd-panel pd-history" data-dashboard-key="boiler-history">'+chart+'</section>' : ''; })(OpenThermostatHistory.boiler(dashboardHistory)) : '')+
                '<section class="pd-panel pd-boiler"><div class="pd-facts">'+
                fact(uiText("Flow"),dashboardNumber(ems.currentFlowTemperature,10,-20,150),'°C')+
                fact(uiText("Return"),dashboardNumber(ems.currentReturnTemperature,10,-20,150),'°C')+
                fact(uiText("Modulation"),dashboardNumber(ems.currentBurnerPower,1,0,100),'%')+
                fact(uiText("Pressure"),dashboardNumber(ems.pressure,10,0,10),'bar')+
                uiHtml("</div><div class=\"pd-lower\"><details class=\"ot-advanced\"><summary>More boiler data</summary><dl class=\"pd-detail-grid\">");
            // Reliable reported fields only, and only when a value was received.
            // Flame/pump/fan bits, flow rate and the read-back setpoint are not
            // reliable on Classic boilers; the boiler page lists them with quality.
            var shown = 0;
            function detail(label,value) {if (value === null || value === undefined) return;shown++;html+='<dt>'+label+'</dt><dd>'+value+'</dd>';}
            [['displayCode',uiText("Display code")],['serviceCode',uiText("Service code")]].forEach(function(item){var value=ems[item[0]];detail(item[1],value==null?null:dashboardText(String(value).slice(0,80)));});
            [['heatingEnabled',uiText("CH enabled")],['warmWaterEnabled',uiText("Hot water enabled")]].forEach(function(item){detail(item[1],typeof ems[item[0]]==='boolean'?dashboardBool(ems[item[0]],uiText("On"),uiText("Off")):null);});
            [['currentWarmWaterTemperature',uiText("Hot water · reported"),10,-20,150],['selectedWarmWaterTemperature',uiText("Hot water target · read back"),1,0,150],['outdoorTemperature',uiText("Outdoor temperature · boiler source"),100,-60,60]].forEach(function(item){var value=dashboardNumber(ems[item[0]],item[2],item[3],item[4]);detail(item[1],value===null||value===undefined||value===''?null:dashboardValue(value,'°C'));});
            if (!shown) html += '<dt>'+uiText("Boiler data")+'</dt><dd>'+uiText("No reliable values received yet")+'</dd>';
            html += uiHtml("</dl><p class=\"pd-help\">Only values the boiler reported recently are shown. All values, with their quality, are on the Boiler page. Telemetry is not an independent physical flame or heat measurement.</p></details></div></section>")+
                uiHtml("<section class=\"pd-panel\"><h2>How this works</h2><details class=\"ot-advanced\" data-dashboard-key=\"shadow-mode-help\"><summary>Shadow mode and boiler commands</summary><p>")+
                (controlling ? uiText("Active control: the E32 controls your boiler. Your old thermostat must stay disconnected.") :
                uiText("Shadow mode: the E32 reads data and calculates demand. Valve and boiler commands remain disabled until the physical command and safe-stop tests are completed."))+'</p>'+
                // The Home Assistant controller's own state and reason are technical detail here.
                (state ? '<p>'+dashboardText(uiText("Boiler control")+': '+dashboardBool(boilerEnabled,uiText("Enabled"),uiText("Blocked"))+' · '+dashboardReason(supervisor.reason))+'</p>' : '')+'<p>'+
                dashboardBool(boilerEnabled,uiText("Control is enabled according to the controller."),uiText("The controller reports blocked outputs."))+
                uiHtml(" No confirmed command timeline is available yet. Calculated room demand is not presented as a transmitted or executed boiler command.</p><p class=\"pd-help\">Flow and return come from the boiler. Modulation is the burner percentage from telemetry, not measured consumption.</p></details>")+
                '<details class="ot-advanced" data-dashboard-key="connection-fallback-help"><summary>'+uiText("Connection loss and fallback")+'</summary><p>'+uiText("An unreachable HA web page alone does not mean the heating connection has failed.")+'</p><p>'+uiText("Without HA heartbeats, control permission expires locally on the E32 after 15 seconds. Reconnecting does not restore old commands or qualified measurements. This software deadline is not proof that the boiler has physically stopped.")+'</p><p>'+uiText("An unpowered E32 cannot send a stop command. Boiler timeout, local valve behaviour and minimum flow during pump overrun require installation-specific tests. This version keeps physical outputs disabled.")+'</p></details>'+
                dashboardBuildSupport(status.control_build)+'</section></section>';
            var main = document.getElementById('maincontainer');
            var current = main.querySelector('.product-dashboard');
            if (current) {
                var template = document.createElement('template'); template.innerHTML = html;
                var focused = document.activeElement, left = window.scrollX, top = window.scrollY;
                patchDashboard(current,template.content.firstElementChild);
                // Moving a keyed room may otherwise blur its focused summary in some browsers.
                if (focused && focused.isConnected && current.contains(focused) && document.activeElement !== focused)
                    focused.focus({preventScroll:true});
                if (window.scrollX !== left || window.scrollY !== top) window.scrollTo(left,top);
            } else {
                main.innerHTML = html;
                if (typeof BoilerDisplay !== 'undefined') BoilerDisplay.mountHome(main.querySelector('.pd-boiler'));
            }
        }

		function updateRooms(status) {
            applyControlMode(status);
			var maincontainer = document.getElementById('maincontainer');
			if (status.controlMode === 'shadow') {
                renderInstallationDashboard(status);
				return;
			}

			var mainColElement = document.createElement('div');
			mainColElement.classList.add('flex-column');
			mainColElement.classList.add('d-flex');
			mainColElement.classList.add('justify-content-between');
			mainColElement.classList.add('align-items-center');


			var tilesBoxElement = document.createElement('div');
			tilesBoxElement.classList.add('row');
			tilesBoxElement.classList.add('d-flex');
			tilesBoxElement.classList.add('w-100');
			tilesBoxElement.classList.add('justify-content-center');

			status.rooms.forEach(element => {
				tilesBoxElement.appendChild(showRoom(element, status.boiler, status.activeProgram));
			});

			let boiler = showBoiler(status.ems, status.boiler)
			if (boiler) {
				tilesBoxElement.appendChild(boiler);
			}

			let ow = showOpenWeather(status.openweather);
			if (ow) {
				tilesBoxElement.appendChild(ow);
			}

			mainColElement.append(tilesBoxElement);

			let uptime = uiHtml("<div class='align-self-end' style='font-size: 0.6rem;'>\n\t\t\tTime: ") + status.time + uiHtml(" uptime: ") + parseInt(status.uptime / 86400) + `d ` + parseInt(status.uptime % 86400 / 3600) + `h ` + parseInt(status.uptime % 3600 / 60) + `m ` + status.uptime % 60 + `s
		</div>`;


			var timeElement = document.createElement('div');
			timeElement.classList.add('flex-row');
			timeElement.classList.add('d-flex');
			timeElement.classList.add('w-100');
			timeElement.classList.add('justify-content-center');
			timeElement.classList.add('align-items-end');
			timeElement.innerHTML = uptime;
			mainColElement.append(timeElement);


			maincontainer.innerHTML = "";
			maincontainer.append(mainColElement);
            if (status.firmware_update && dashboardUpdateNotice(status.firmware_update)) {
                var notice=document.createElement('div');
                notice.innerHTML=dashboardUpdateNotice(status.firmware_update);
                mainColElement.prepend(notice);
            }
			if (typeof BoilerDisplay !== 'undefined') BoilerDisplay.mountHome(mainColElement);
		}

		function showRoom(room, boilerStats, activeProgram) {
			let heating = room.shouldContinueHeating && boilerStats.boiler;
			if (consoleLog) console.log(room.name + uiText(" heating: ") + heating);

			var heatingIcon = "";
			if (!room.enabled) {
				heatingIcon = `<svg width="16px" height="16px"><use href="#img-power"></svg>`;
			} else if (heating) {
				heatingIcon = `<svg width="16px" height="16px"><use style='' href="#img-flame" /></svg>`
			}

			let setTemp = (room.tempSet / 100).toFixed(2);
			let meanTemp = (room.meanTemp !== undefined) ? (room.meanTemp / 100).toFixed(2) : '-';
			let currentHumidity = (room.currentHumidity !== undefined) ? (room.currentHumidity / 100).toFixed(1) + '%' : '';
			let batteryLevel = (room.batteryLevel !== undefined && room.batteryLevel >= 0) ? room.batteryLevel + '%' : '';

			let humidityVisibility = (room.currentHumidity !== undefined) ? '' : 'visibility: hidden;'
			let batteryVisibility = (room.batteryLevel !== undefined && room.batteryLevel >= 0) ? '' : 'visibility: hidden;'


			let programName = activeProgram;
			if (room.currentProgram !== undefined && room.currentProgram !== null) {
				programName = room.currentProgram;
			}
			if (room.temporaryProgramSecondsLeft > 0) {
				programName = uiText("Temporary (") + getTimeLeftFromSecs(room.temporaryProgramSecondsLeft) + ")";
			}

			if (room.controlStatus === 'clock_unavailable') {
				programName = uiText("Waiting for device time; heating is paused.");
			}

			let lowBatteryStyle = '';
			if (room.batteryLevel !== undefined && room.batteryLevel < 6) {
				lowBatteryStyle = 'fill: red; animation: blink 1s linear infinite alternate;';
			}

			var cont = `
			<div class='col m-1 border border-3 rounded-lg bg-light' style='width: 9rem; height: 8rem;'>
				<div class='row justify-content-center' style='font-size: 0.9rem;'>` + escapeHtml(room.name) + `</div>
				<div class='row justify-content-center' style='font-size: 1.5rem; font-weight: bold;'>` + meanTemp + `&deg;C</div>
				<div class='row justify-content-center' style='font-size: 0.8rem;'>` + setTemp + `&deg;C</div>
				<div class='row mb-3 justify-content-center' style='font-size: 0.6rem;'>` + escapeHtml(programName) + `</div>
				<div class='row d-flex justify-content-between' style='height: 1.0rem;'>
					<div class='ml-1' style='font-size: 0.6rem; height: 1.0rem; width: 3rem; display: flex; justify-content: flex-start;  align-items: center; ` + humidityVisibility + `'><svg viewBox="0 0 4.2333 4.2333" style="height: 0.7rem;"><path d="m1.8871 0.27523c-0.37917 0.56261-0.80901 1.1306-1.0408 1.7744-0.93792 2.6049 3.277 2.8553 2.5517 0.33054-0.20597-0.7169-1.0431-1.6366-1.3761-2.2757l-0.13472 0.17081m-0.938 2.4606c0.037288 0.26239 0.15761 0.47453 0.30894 0.64822 0.3167 0.2848 0.51096 0.32871 0.8065 0.43986-0.47881 0.099642-1.2481-0.55694-1.1154-1.0881z" fill="#090909"/></svg>` + currentHumidity + `</div>
					<div style='font-size: 0.6rem; height: 1.0rem;'>` + heatingIcon + `</div>
					<div class='mr-1' style='font-size: 0.6rem; height: 1.0rem; width: 3rem; display: flex; justify-content: flex-end;  align-items: center;` + batteryVisibility + `'>` + batteryLevel + `<svg viewBox="0 0 4.2333 4.2333"  style="height: 0.7rem; ` + lowBatteryStyle + `"><path d="m2.1263 4.0871h-1.1848v-3.5545h0.59242v-0.39495h1.1848v0.39495h0.59242v3.5545zm0-1.7773h0.7899v-1.3823h-0.55951l-0.00128-0.40485-0.23065-0.009105-0.22803-0.008038-8.21e-4 0.42199h-0.5595v1.3823z" stroke-width=".19748"/></svg></div>
				</div>
			</div>
		`;

			var roomElement = document.createElement('div');
			roomElement.innerHTML = cont;
			roomElement.firstElementChild.addEventListener('click', function(event) {
				setTemporaryTemp(event, room.name);
			});
			return roomElement;

		}

		function setTemporaryTemp(event, roomName) {
			$('#temporaryTempModalRoomName').text(roomName);
			lastLoadedStatus.rooms.forEach(element => {
				if (element.name === roomName) {
					$('#temporaryTempModalTemperature').val(element.tempSet / 100).trigger('input');
				}
			});
			$('#temporaryTempModal').modal('show');
		}

		function getTimeLeftFromSecs(val) {
			let hours = 0, minutes = 0, seconds = 0, left = val;
			hours = Math.floor(left / 3600);
			left = left - (hours * 3600);
			minutes = Math.floor(left / 60);
			left = left - (minutes * 60);
			seconds = left;
			time = "";
			if (hours > 0) {
				time += hours + "h ";
			}
			if (minutes > 0) {
				time += minutes + "m ";
			}
			if (seconds > 0) {
				time += seconds + "s";
			}
			return time;
		}

		function updateTemporaryTempModalTimeText(val) {
			$('#temporaryTempModalTimeText').val(getTimeLeftFromSecs(val * 60));
		}

		function updateTemporaryTempModalTemperature(val) {
			$('#temporaryTempModalTemperatureText').val(val + '°C');
		}

	</script>


</body>
