<div class="d-flex justify-content-center" id="loadingprogress">
	<div class="spinner-border" role="status">
		<span class="sr-only"></span>
	</div>
</div>

<div class="alert alert-warning d-none" id="programLoadingError" role="alert">
	<span id="programLoadingErrorMessage"></span>
	<button type="button" class="btn btn-outline-dark btn-sm" onclick="loadProgramConfiguration()"><span data-i18n="Retry loading programs">Retry loading programs</span></button>
</div>
<form id="programeditform" class="invisible" novalidate>
	<div class="form-group">
		<div class="form-row align-items-end">
			<div class="col mb-2">
				<label for="selectprogram"><span data-i18n="Select program to edit">Select program to edit</span></label>
				<select class="form-control" id="selectprogram" name="program" data-no-validation onchange="loadProgram()"></select>
			</div>
			<div class="col-md-2 mb-2">
				<button type="button" class="btn btn-success form-control"
					onclick='openCreateProgramNameModal(event);'><span data-i18n="Create new program">Create new program</span></button>
			</div>
			<div class="col-md-2 mb-2">
				<button type="button" class="btn btn-dark form-control" onclick="deleteProgram();"><span data-i18n="Delete program">Delete program</span></button>
			</div>
		</div>
	</div>

	<div class="card collapse" id="roomTemperatureSettings">
		<div class="card-header"><span data-i18n="Program settings by room">Program settings by room</span></div>
		<div class="card-body">
			<div class="alert alert-warning" id="missingProgramRooms" hidden>
				<span id="missingProgramRoomsMessage"></span>
				<button type="button" class="btn btn-outline-dark btn-sm" onclick="removeMissingProgramRooms();"><span data-i18n="Remove missing rooms">Remove missing rooms</span></button>
				<span><span data-i18n="Then save this program.">Then save this program.</span></span>
			</div>
			<div class="form-group" id="roomSelector">
				<div class="form-row align-items-end">
					<div class="col mb-2">
						<label for="roomSelectorSelect"><span data-i18n="Select room in program">Select room in program</span></label>
						<div class="input-group">
							<select class="form-control" id="roomSelectorSelect" name="roomselected" data-no-validation
								onchange="changeRoom()">
							</select>
						</div>
					</div>
					<div class="col-md-2 mb-2">
						<button type="button" class="btn btn-success form-control"
							onclick='openAddNewRoomModal(event);'><span data-i18n="Add room to program">Add room to program</span></button>
					</div>
					<div class="col-md-2 mb-2">
						<button type="button" class="btn btn-dark form-control" onclick="deleteRoom();"><span data-i18n="Remove from program">Remove from program</span></button>
					</div>
				</div>
			</div>

			<div class="form-group" id="roomGroup">

			</div>

		</div>
		<div class="card-footer text-muted">
			<button type="button" class="btn btn-primary mb-2" onclick="saveProgram();" id="saveprogram"><span data-i18n="Save program">Save program</span></button>
		</div>

	</div>


</form>




<script type='text/javascript'>
	var loadedProgram = undefined;
	var loadedRooms = [];
	var roomDefinition = undefined;
	var roomFound = undefined;
	var valveCount = 0;
	var valveLabels = [];

	function populateValveSelect(selectId, allowedValves) {
		var $sel = $(selectId);
		$sel.find('option').remove();
		var valves = allowedValves || Array.from({length: valveCount}, (_, i) => i);
		valves.forEach(function(v) {
			var label = typeof v === 'number' ? (valveLabels[v] || (uiText("Valve ") + (v + 1))) : v;
			var value = typeof v === 'number' ? String(v) : v;
			$sel.append($('<option>').val(value).text(label));
		});
	}

	// Convert old numeric valve references to labels
	function resolveValves(valves) {
		if (!Array.isArray(valves)) return [];
		return valves.map(function(v) {
			if (typeof v === 'number') {
				return String(v);
			}
			return v;
		});
	}

	$(document).ready(function () {
		const programsPane = document.getElementById('roomProgramsPane');
		if (programsPane) programsPane.addEventListener('roomcatalogsaved', function (event) {
			loadedRooms = event.detail.rooms;
			if (event.detail.reload) { loadProgram(); return; }
			if (loadedProgram) {
				const selectedId = $('#roomSelectorSelect').val();
				refreshLoadedProgram();
				$('#roomSelectorSelect').val(selectedId);
				if ($('#roomSelectorSelect').val()) changeRoom();
			}
		});

		var hardwareReady = fetch(hostName + '/config/hardware', {signal: AbortSignal.timeout(10000), cache: 'no-store'})
			.then(validateResponse)
			.then(res => res.json())
			.then(function(cfg) {
				var pins = cfg.valve_pins;
				valveCount = Array.isArray(pins) ? pins.length : 0;
				valveLabels = [];
				if (Array.isArray(pins)) {
					pins.forEach(function(pin, idx) {
						if (pin && typeof pin === 'object' && pin.label) {
							valveLabels.push(pin.label);
						} else {
							valveLabels.push(uiText("Valve ") + (idx + 1));
						}
					});
				}
			})
			.catch(function() {
				valveCount = 8;
				valveLabels = [];
			});

		hardwareReady.then(loadProgramConfiguration);

	});

	async function saveProgram() {
		if (!validateForm('#programeditform')) return;
		var program = JSON.stringify(loadedProgram, undefined, null);
		var selector = document.getElementById('selectprogram');

		$("#saveprogram").prop('disabled', true);

		try {
		const url = hostName + '/config/programs/' + encodeURIComponent(selector.value);
		const response = await fetch(url, {
			method: 'post',
			cache: 'no-cache',
			credentials: 'same-origin',
			headers: { "Content-Type": "application/json" },
			body: program
		});
		if (!response.ok) throw new Error((await response.text()) || response.statusText);
		const readback = await fetch(url, {cache: 'no-store'});
		if (!readback.ok || JSON.stringify(await readback.json()) !== JSON.stringify(JSON.parse(program))) throw new Error(uiText("Saved program could not be verified. Reload before retrying."));
		alert(uiText("Program saved and verified."));
		} catch (error) { alert(uiText("Cannot save program: ") + error); }
		finally { $("#saveprogram").prop('disabled', false); }
	}

	async function readProgramConfiguration(url) {
		const response = await fetch(hostName + url, {signal: AbortSignal.timeout(10000), cache: 'no-store'});
		validateResponse(response);
		return response.json();
	}

	function showProgramLoadingError(error) {
		$('#loadingprogress').removeClass('d-flex').addClass('d-none');
		$('#programLoadingErrorMessage').text(uiText("Cannot load programs. Check the device connection, then retry. ") + error.message);
		$('#programLoadingError').removeClass('d-none');
	}

	async function loadProgramConfiguration() {
		$('#programLoadingError').addClass('d-none');
		$('#programeditform').addClass('invisible');
		$('#loadingprogress').removeClass('d-none invisible').addClass('d-flex');
		try {
			const rooms = await readProgramConfiguration('/config/rooms');
			if (!Array.isArray(rooms)) throw new Error(uiText("Invalid room catalog"));
			loadedRooms = rooms;
			await getAvailablePrograms();
		} catch (error) { showProgramLoadingError(error); }
	}

	async function getAvailablePrograms() {
		const programs = await readProgramConfiguration('/status/programs');
		const prog = await readProgramConfiguration('/config/program/current');
		if (!Array.isArray(programs) || !programs.length || !programs.every(name => typeof name === 'string' && name.length) || !prog || typeof prog.program !== 'string') throw new Error(uiText("Invalid program inventory"));
		$('#selectprogram').empty();
		programs.forEach(name => $('#selectprogram').append($('<option>').text(name).prop('selected', name === prog.program)));
		if (await loadProgram()) {
			$('#loadingprogress').removeClass('d-flex').addClass('d-none');
			$('#programeditform').removeClass('invisible');
		}
	}

	function openCreateProgramNameModal(event) {
		event.preventDefault();
		$('#editModalLabel').text(uiText("Enter new program name"));
		$('#editModalBody').html(uiHtml("\n\t\t<form>\n\t\t<input type='text' class='form-control' id='modalEditorInput'>\n\t\t<div class=\"form-group form-check\">\n\t\t\t<input type=\"checkbox\" class=\"form-check-input\" id=\"cloneSelected\">\n\t\t\t<label class=\"form-check-label\" for=\"cloneSelected\">Clone selected program</label>\n\t\t</div>\n\t\t</form>"));

		$("#editModalSave").off('click');
		$("#editModalSave").on('click', function (event) {
			event.preventDefault();
			let name = $('#modalEditorInput').val();
			if (name === undefined || name.length === 0) {
				alert(uiText("Name must be specified"));
				return;
			}
			createProgram(name, $('#cloneSelected').prop('checked'));
			$('#editModal').modal('hide');
		});

		$('#editModal').modal('show');
	}

	function createProgram(name, clone) {
		if (!clone) {
			loadedProgram = [];
		}

		$('#selectprogram').append($('<option>').prop('selected', true).text(name));
		saveProgram();
		refreshLoadedProgram();
	}

	function deleteProgram() {
		var selector = document.getElementById('selectprogram');
		if (selector.value === "default") {
			alert(uiText("Program 'default' can't be deleted"));
			return;
		}

		if (!confirm(uiText("Are you sure to delete program '") + selector.value + "'?")) {
			return;
		}

		fetch(hostName + '/config/programs/' + selector.value, {
			method: 'delete',
			// mode: 'no-cors',
			cache: 'no-cache',
			credentials: 'same-origin'
		})
			.then(res => {
				if ((res.status >= 200 && res.status <= 205) || res.type === "opaque") {
					$('#selectprogram option:selected').remove()
					$('#selectprogram').trigger('change');
				} else {
					alert(uiText("Not sure if program deleted Status: ") + res.status + uiText("\nBody:\n") + res.statusText);
				}
			})
			.catch(function (error) {
				alert(error);
			});
	}

	async function loadProgram() {
		loadedProgram = undefined;
		var selector = document.getElementById('selectprogram');

		$('#programeditform').submit(false);
		$('#roomSelectorSelect').empty();

		try {
			const value = await readProgramConfiguration('/config/programs/' + encodeURIComponent(selector.value));
			if (!Array.isArray(value)) throw new Error(uiText("Invalid program"));
			$('#roomTemperatureSettings').collapse("show");
			loadedProgram = value;
			refreshLoadedProgram();
			$('#programLoadingError').addClass('d-none');
			return true;
		} catch (error) {
			$('#roomTemperatureSettings').collapse("hide");
			showProgramLoadingError(error);
			return false;
		}
	}

	function refreshLoadedProgram() {
		$('#roomSelectorSelect').find('option').remove();

		loadedProgram.forEach(element => {
			$('#roomSelectorSelect').append($('<option>').val(element.room_id).text((loadedRooms.find(room => room.id === element.room_id) || {}).name || (uiText("Missing room (") + element.room_id + ')')));
		});
		const missing = loadedProgram.filter(entry => !loadedRooms.some(room => room.id === entry.room_id));
		document.getElementById('missingProgramRooms').hidden = missing.length === 0;
		document.getElementById('missingProgramRoomsMessage').textContent = missing.length + uiText(" settings refer to rooms that no longer exist. ");

		$('#roomTemperatureSettings *').attr('disabled', false);
		if (loadedProgram.length === 0) {
			$('#roomGroup').empty();
		} else {
			changeRoom();
		}

	}

	function removeMissingProgramRooms() {
		if (!confirm(uiText("Remove settings for all missing rooms from this program? Existing rooms are kept."))) return;
		loadedProgram = loadedProgram.filter(entry => loadedRooms.some(room => room.id === entry.room_id));
		refreshLoadedProgram();
	}

	function openAddNewRoomModal(event) {
		event.preventDefault();
		var available = loadedRooms.filter(room => !loadedProgram.some(entry => entry.room_id === room.id));
		if (available.length === 0) {
			alert(uiText("All rooms already have settings in this program. Add a room in Room configuration first."));
			return;
		}
		$('#editModalLabel').text(uiText("Add room to program"));
		var select = $('<select class="form-control" id="addProgramRoom"></select>');
		available.forEach(room => select.append($('<option>').val(room.id).text(room.name)));
		$('#editModalBody').empty().append(select);
		$('#editModalSave').off('click').on('click', function (event) {
			event.preventDefault();
			addNewRoom(select.val());
			$('#editModal').modal('hide');
		});
		$('#editModal').modal('show');
	}

	function addNewRoom(id) {
		if (!loadedRooms.some(room => room.id === id) || loadedProgram.some(entry => entry.room_id === id)) return;
		loadedProgram.push({room_id: id, base_temp: 1900, temp_margin_up: 5,
			temp_margin_down: 15, enabled: false, temperatures: []});
		refreshLoadedProgram();
		$('#roomSelectorSelect option:last').prop('selected', true).trigger('change');
	}

	function deleteRoom() {
		var selected = $('#roomSelectorSelect').prop('selectedIndex');
		if (selected < 0) return;
		var room = loadedRooms.find(r => r.id === loadedProgram[selected].room_id);
		if (!confirm(uiText("Remove '") + (room ? room.name : uiText("unknown room")) + uiText("' from this program?"))) return;
		loadedProgram.splice(selected, 1);
		refreshLoadedProgram();
	}


	function changeRoom() {
		var roomSelectorHtml = uiHtml("\n\t<div class=\"form-check\">\n\t\t\t<input class=\"form-check-input\" type=\"checkbox\" value=\"\" id=\"roomEnabledCheck\">\n\t\t\t<label class=\"form-check-label\" for=\"roomEnabledCheck\">Enabled</label>\n\t</div>\n\n\t<div class=\"form-row mb-3\">\n\t\t<div class=\"col-md-4 mb-2\">\n\t\t\t<label for=\"roomBaseTemp\">Base room temperature</label>\n\t\t\t<div class=\"input-group\">\n\t\t\t\t<input type=\"number\" class=\"form-control\" id=\"roomBaseTemp\" placeholder=\"20.00\" value=\"\" step=\"0.05\" min=10 max=30 required>\n\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">&deg;C</div></div>\n\t\t\t\t<div class=\"invalid-feedback\">10 - 30 &deg;C</div>\n\t\t\t</div>\n\t\t</div>\n\t\t<div class=\"col-md-4 mb-2\">\n\t\t\t<label for=\"roomUpperMaging\">Turn off the heating if the temperature rises by</label>\n\t\t\t<div class=\"input-group\">\n\t\t\t\t<input type=\"number\" class=\"form-control\" id=\"roomUpperMaging\" placeholder=\"0.10\" value=\"\" step=\"0.01\" min=0.01 max=5  required>\n\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">&deg;C</div></div>\n\t\t\t\t<div class=\"invalid-feedback\">0.01 - 5 &deg;C</div>\n\t\t\t</div>\n\t\t</div>\n\t\t<div class=\"col-md-4 mb-2\">\n\t\t\t<label for=\"roomLowerMargin\">Turn on the heating if the temperature drops by</label>\n\t\t\t<div class=\"input-group\">\n\t\t\t\t<input type=\"number\" class=\"form-control\" id=\"roomLowerMargin\" placeholder=\"0.10\" value=\"\" step=\"0.01\" min=0.01 max=5 required>\n\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">&deg;C</div></div>\n\t\t\t\t<div class=\"invalid-feedback\">0.01 - 5 &deg;C</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\n\t<div class=\"card\">\n\t\t<div class=\"card-header\">Temperature overrides</div>\n\t\t<div class=\"card-body\" id=\"tempOverridesSelectGroupBody\">\n\t\t\t<div class=\"form-group\" id=\"tempOverridesSelectGroup\">\n\t\t\t\t<div class=\"form-row\">\n\t\t\t\t\t<div class=\"col mb-2\">\n\t\t\t\t\t\t<div class=\"input-group\">\n\t\t\t\t\t\t\t<div class=\"input-group-prepend\">\n\t\t\t\t\t\t\t\t<button class=\"btn btn-outline-secondary\" type=\"button\" id=\"tempOverridesSelectEdit\" onclick=\"openEditTempOverrideNameModal(event);\"><svg width=\"16px\" height=\"16px\"><use href=\"#img-edit\" /></svg></button>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<select class=\"form-control\" id=\"tempOverridesSelect\" name=\"tempselected\" data-no-validation aria-describedby=\"tempOverridesSelectEdit\" onchange=\"selectTempOverride()\">\n\t\t\t\t\t\t\t</select>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"col-md-2 mb-2\">\n\t\t\t\t\t\t<button type=\"button\" class=\"btn btn-success form-control\" onclick='openAddNewOverrideModal(event);'>Add new override</button>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"col-md-2 mb-2\">\n\t\t\t\t\t\t<button type=\"button\" class=\"btn btn-dark form-control\" onclick=\"deleteTempOverride();\">Delete override</button>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t</div>\n\n\t\t\t<div class=\"form-group\" id=\"tempOverridesDetailsGroup\">\n\t\t\t\t<div class=\"form-row\">\n\t\t\t\t\t<div class=\"col-md-3 mb-2\">\n\t\t\t\t\t\t<div class=\"form-check\">\n\t\t\t\t\t\t\t<input class=\"form-check-input\" type=\"checkbox\" value=\"\" id=\"tempOverridesEnabled\">\n\t\t\t\t\t\t\t<label class=\"form-check-label\" for=\"tempOverridesEnabled\">Enabled</label>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\n\t\t\t\t<div class=\"form-row\">\n\t\t\t\t\t<div class=\"col-md-3 mb-2\">\n\t\t\t\t\t\t<label for=\"tempOverridesTemp\">Room temperature</label>\n\t\t\t\t\t\t<div class=\"input-group\">\n\t\t\t\t\t\t\t<input type=\"number\" class=\"form-control\" id=\"tempOverridesTemp\" placeholder=\"20.0\" value=\"\" step=\"0.05\" min=0 max=30 required>\n\t\t\t\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">&deg;C</div></div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"col-md-3 mb-2\">\n\t\t\t\t\t\t<label for=\"tempOverridesTimeFrom\">Time from</label>\n\t\t\t\t\t\t<div class=\"input-group\">\n\t\t\t\t\t\t\t<input type=\"time\" class=\"form-control\" id=\"tempOverridesTimeFrom\" placeholder=\"22:00\" value=\"22:00\" required>\n\t\t\t\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">HH:MM</div></div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"col-md-3 mb-2\">\n\t\t\t\t\t\t<label for=\"tempOverridesTimeTo\">Time to</label>\n\t\t\t\t\t\t<div class=\"input-group\">\n\t\t\t\t\t\t\t<input type=\"time\" class=\"form-control\" id=\"tempOverridesTimeTo\" placeholder=\"22:10\" value=\"\" required>\n\t\t\t\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">HH:MM</div></div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\n\t\t\t\t<div class=\"form-row mb-3\">\n\t\t\t\t\t<div class=\"col-md-6 mb-2\">\n\t\t\t\t\t\t<label for=\"roomBaseTemp\">Boiler heating temperature override (EMS only). Leave blank if you don't want to override.</label>\n\t\t\t\t\t\t<div class=\"input-group\">\n\t\t\t\t\t\t\t<input type=\"number\" class=\"form-control\" id=\"tempOverridesBoiler\" placeholder=\"\" value=\"\" step=\"1\" min=30 max=75>\n\t\t\t\t\t\t\t<div class=\"input-group-append\"><div class=\"input-group-text\">&deg;C</div></div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\n\t\t\t\t<div class=\"form-row\">\n\t\t\t\t\t<div class=\"col-md-auto mb-2\">\n\t\t\t\t\t\t<label for=\"tempOverridesWeekdays\">Applies to the days of the week</label><br/>\n\t\t\t\t\t\t<select id=\"tempOverridesWeekdays\" multiple=\"multiple\">\n\t\t\t\t\t\t\t<option value=0>Sunday</option>\n\t\t\t\t\t\t\t<option value=1>Monday</option>\n\t\t\t\t\t\t\t<option value=2>Tuesday</option>\n\t\t\t\t\t\t\t<option value=3>Wednesday</option>\n\t\t\t\t\t\t\t<option value=4>Thursday</option>\n\t\t\t\t\t\t\t<option value=5>Friday</option>\n\t\t\t\t\t\t\t<option value=6>Saturday</option>\n\t\t\t\t\t\t</select>\n\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"col mb-2\">\n\t\t\t\t\t\t<label for=\"tempOverridesValvesSelect\">Override valves</label><br/>\n\t\t\t\t\t\t<select id=\"tempOverridesValvesSelect\" multiple=\"multiple\">\n\t\t\t\t\t\t</select>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n");



		var selected = $("#roomSelectorSelect").prop('selectedIndex');
		roomFound = loadedProgram[selected];
		roomDefinition = roomFound && loadedRooms.find(room => room.id === roomFound.room_id);
		if (roomFound === undefined || roomDefinition === undefined) {
			$('#roomGroup').html("");
			return;
		}

		$('#roomGroup').html(roomSelectorHtml);

		$('#roomEnabledCheck').prop('checked', roomFound.enabled === undefined ? true : roomFound.enabled);
		$('#roomEnabledCheck').change(function () {
			roomFound.enabled = $(this).prop('checked');
		});

		$('#roomBaseTemp').val(roomFound.base_temp / 100).on('input', function () {
			roomFound.base_temp = $(this).val() * 100;
		});
		$('#roomUpperMaging').val(roomFound.temp_margin_up / 100).on('input', function () {
			roomFound.temp_margin_up = $(this).val() * 100;
		});
		$('#roomLowerMargin').val(roomFound.temp_margin_down / 100).on('input', function () {
			roomFound.temp_margin_down = $(this).val() * 100;
		});

		showTempOverrides();
	}

	function showTempOverrides() {
		if (roomFound.temperatures !== undefined) {
			roomFound.temperatures.forEach(element => {
				$('#tempOverridesSelect').append($('<option>').text(element.name));
			});
		}

		$('#tempOverridesWeekdays').multiselect({
			includeSelectAllOption: false,
			allSelectedText: uiText("A whole week"),
			nonSelectedText: uiText("Choose weekdays"),
			numberDisplayed: 0,
			selectAllNumber: false,
			onChange: function () {
				const toNumbers = arr => arr.map(Number);
				var selectedOptions = toNumbers($('#tempOverridesWeekdays').val());

				if (selectedOptions.length == 0) {
					alert(uiText("You must select at least one day"));
					$('#tempOverridesWeekdays').multiselect('select', getSelectedTemp().days);
					return false;
				}

				getSelectedTemp().days = selectedOptions;
			}
		});

		populateValveSelect('#tempOverridesValvesSelect', roomDefinition.valves);
		$('#tempOverridesValvesSelect').multiselect({
			includeSelectAllOption: false,
			allSelectedText: uiText("Heat on all valves"),
			nonSelectedText: uiText("Do not override"),
			numberDisplayed: 0,
			selectAllNumber: false,
			onChange: function () {
				var selectedOptions = $('#tempOverridesValvesSelect').val() || [];
				if (selectedOptions.length !== 0) {
					getSelectedTemp().valves = selectedOptions;
				} else {
					delete getSelectedTemp().valves;
				}
			}
		});

		if (roomFound.temperatures === undefined || roomFound.temperatures.length == 0) {
			$('#tempOverridesDetailsGroup *').attr('disabled', true);
			$('#tempOverridesSelect').attr('disabled', true);
			$('#tempOverridesSelectEdit').attr('disabled', true);
			$('#tempOverridesWeekdays').multiselect();
			$('#tempOverridesValvesSelect').multiselect();
		} else {
			$('#tempOverridesSelectGroupBody *').attr('disabled', false);
			selectTempOverride();
		}
	}

	function getSelectedTemp() {
		var selected = $("#tempOverridesSelect").prop('selectedIndex');
		return roomFound.temperatures[selected];
	}




	function openAddNewOverrideModal(event) {
		event.preventDefault();
		$('#editModalLabel').text(uiText("Enter name for temperature override"));
		$('#editModalBody').html(uiHtml("<form novalidate><input type=\"text\" class=\"form-control\" id=\"addNewOverrideName\" pattern=\"[A-Za-z0-9_\\-]+\" required><div class=\"invalid-feedback\">Only letters, digits, _ and - allowed</div></form>"));
		$("#editModalSave").off('click');
		$("#editModalSave").on('click', function (event) {
			event.preventDefault();
			var input = $('#addNewOverrideName')[0];
			input.parentElement.classList.add('was-validated');
			if (!input.checkValidity()) return;
			let name = $('#addNewOverrideName').val();
			createNewTempOverride(name);
			$('#editModal').modal('hide');
		});
		$('#editModal').modal('show');
	}

	function createNewTempOverride(name) {

		var newTemp = {};
		newTemp.name = name;
		newTemp.time_from = "00:00";
		newTemp.time_to = "00:01";
		newTemp.temp = 1800;
		newTemp.boiler_temp = "";
		newTemp.enabled = false;
		newTemp.days = [0, 1, 2, 3, 4, 5, 6];
		if (roomFound.temperatures === undefined) {
			roomFound.temperatures = [];
		}
		roomFound.temperatures.push(newTemp);

		$('#tempOverridesSelect').find('option').remove();
		showTempOverrides();
		$("#tempOverridesSelect option:last").attr("selected", "selected").trigger('change');
	}


	function openEditTempOverrideNameModal(event) {
		event.preventDefault();
		$('#editModalLabel').text(uiText("Enter temperature override name"));
		$('#editModalBody').html(uiHtml("<form novalidate><input type=\"text\" class=\"form-control\" id=\"editOverrideName\" pattern=\"[A-Za-z0-9_\\-]+\" required><div class=\"invalid-feedback\">Only letters, digits, _ and - allowed</div></form>"));
		$('#editOverrideName').val(getSelectedTemp().name);
		$("#editModalSave").off('click');
		$("#editModalSave").on('click', function (event) {
			event.preventDefault();
			var input = $('#editOverrideName')[0];
			input.parentElement.classList.add('was-validated');
			if (!input.checkValidity()) return;
			let name = $('#editOverrideName').val();
			getSelectedTemp().name = name;
			$('#tempOverridesSelect').children("option:selected").text(getSelectedTemp().name);
			$('#editModal').modal('hide');
		});
		$('#editModal').modal('show');
	}

	function deleteTempOverride() {
		var selected = $("#tempOverridesSelect").prop('selectedIndex');
		if (!confirm(uiText("Do you want to delete temperature override '") + roomFound.temperatures[selected].name + "'?")) {
			return;
		}

		roomFound.temperatures.splice(selected, 1);

		$('#tempOverridesSelect').find('option').remove();
		showTempOverrides();
	}

	function selectTempOverride() {
		$('#tempOverridesWeekdays').multiselect('deselectAll', false);

		if (getSelectedTemp().days === undefined || getSelectedTemp().days.length == 0) {
			$('#tempOverridesWeekdays').multiselect('selectAll', false);
		} else {
			$('#tempOverridesWeekdays').multiselect('select', getSelectedTemp().days);
		}

		if (getSelectedTemp().valves === undefined || getSelectedTemp().valves.length == 0) {
			$('#tempOverridesValvesSelect').multiselect('deselectAll', false).multiselect('refresh');
		} else {
			$('#tempOverridesValvesSelect').multiselect('select', resolveValves(getSelectedTemp().valves)).multiselect('refresh');
		}

		$('#tempOverridesEnabled').prop('checked', getSelectedTemp().enabled === undefined ? true : getSelectedTemp().enabled);
		$('#tempOverridesEnabled').change(function () {
			getSelectedTemp().enabled = $(this).prop('checked');
		});

		$('#tempOverridesTemp').val(getSelectedTemp().temp / 100).on('input', function () {
			getSelectedTemp().temp = $(this).val() * 100;
		});

		$('#tempOverridesBoiler').val(getSelectedTemp().boiler_temp).on('input', function () {
			if ($(this).val().length > 0) {
				getSelectedTemp().boiler_temp = parseInt($(this).val());
			} else {
				getSelectedTemp().boiler_temp = null;
			}
		});

		$('#tempOverridesTimeFrom').val(getSelectedTemp().time_from).on('input', function () {
			getSelectedTemp().time_from = $(this).val();
		});

		$('#tempOverridesTimeTo').val(getSelectedTemp().time_to).on('input', function () {
			getSelectedTemp().time_to = $(this).val();
		});
	}

</script>
