name: E32 vendor source inputs

on:
  push:
    tags: ['sources-e32v2-*']

jobs:
  verify-source-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub exposes unpublished drafts only to callers with push access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test source archive validation and denial cases
        run: python -B -m unittest discover -s scripts -p test_e32_source_inputs.py -v
      - name: Download the prepared draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import hashlib,json,os,subprocess
          from pathlib import Path
          spec=json.loads(Path('docs/third-party/e32v2-source-distribution.json').read_text())
          assert spec['schema']==1 and spec['environment']=='e32v2'
          assert spec['tag']==os.environ['EXPECTED_TAG']
          assert spec['firmware_release_approved'] is False
          assert Path(spec['asset']).name==spec['asset'] and spec['asset'].endswith('.zip')
          release=json.loads(subprocess.check_output(['gh','release','view',spec['tag'],'--json','isDraft,isPrerelease'],text=True))
          assert release['isDraft'] and release['isPrerelease'],'Only a prepared source-only draft can be published'
          subprocess.run(['gh','release','download',spec['tag'],'--pattern',spec['asset'],'--dir','out/source-inputs'],check=True)
          archive=Path('out/source-inputs')/spec['asset']
          assert archive.stat().st_size==spec['bytes']
          h=hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''):h.update(block)
          assert h.hexdigest()==spec['sha256'],'Prepared archive differs from committed digest'
          PYTHON
      - name: Verify every source input against the committed correspondence
        run: |
          python scripts/e32_source_inputs.py --policy docs/third-party/e32v2-source-inputs.json --archive out/source-inputs/openthermostat-e32v2-source-inputs-20261023.1.zip > out/source-inputs/VERIFICATION.json
      - uses: actions/upload-artifact@v6
        with:
          name: verified-e32-source-inputs
          path: out/source-inputs/VERIFICATION.json
          if-no-files-found: error

  publish-source-inputs:
    needs: verify-source-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: verified-e32-source-inputs
          path: out/source-inputs
      - name: Publish the verified source-only draft
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json,os,subprocess
          from pathlib import Path
          spec=json.loads(Path('docs/third-party/e32v2-source-distribution.json').read_text())
          proof=json.loads(Path('out/source-inputs/VERIFICATION.json').read_text())
          assert spec['tag']==os.environ['EXPECTED_TAG']
          assert proof['status']=='PASS_VENDOR_SOURCE_INPUTS_ONLY'
          assert proof['firmware_release_approved'] is False
          release=json.loads(subprocess.check_output(['gh','release','view',spec['tag'],'--json','isDraft,isPrerelease,assets'],text=True))
          assert release['isDraft'] and release['isPrerelease']
          assert len(release['assets'])==1
          asset=release['assets'][0]
          assert asset['name']==spec['asset'] and asset['size']==spec['bytes']
          assert asset['digest']=='sha256:'+spec['sha256'],'Remote asset changed after verification'
          subprocess.run(['gh','release','edit',spec['tag'],'--draft=false','--prerelease'],check=True)
          PYTHON
      - name: Refresh source-package labels and installation overview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/organize_releases.py --repository "$GITHUB_REPOSITORY" --output out/release-catalog-plan.json --apply
